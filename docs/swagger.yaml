openapi: 3.0.3
info:
  title: gradebook-api
  description: >
    API REST en Flask con autenticación propia (JWT) y control de acceso por roles y permisos
    (RBAC). Personas: docentes y estudiantes (login por email). El rol de seguridad se deriva
    (docente por cargo, estudiante = usuario) y los permisos se configuran por rol y por usuario.
    Arquitectura en capas routes / services / validators / db con backend Supabase.
  version: 2.0.0

servers:
  - url: http://localhost:5000/gradebook_api
    description: Desarrollo local

tags:
  - name: auth
    description: Autenticación (login por email + password)
  - name: docentes
    description: Gestión de docentes
  - name: estudiantes
    description: Gestión de estudiantes
  - name: cursadas
    description: Cursos / cursadas de una materia
  - name: asistencias
    description: Asistencia por QR (clases, envío de QRs y marcado)
  - name: roles
    description: Roles y catálogo de permisos (RBAC)

paths:
  /login:
    post:
      tags: [auth]
      summary: Login por email + password (docente o estudiante)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Login correcto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /password-reset/solicitar:
    post:
      tags: [auth]
      summary: Solicita el email de recuperación de contraseña (público)
      description: >
        Si el email corresponde a un docente o estudiante, envía un email con un enlace de un solo
        uso (token opaco en Redis, TTL 30 min) para restablecer la contraseña. Responde **siempre**
        el mismo mensaje, exista o no el email (no permite enumerar usuarios).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, example: docente@fi.uba.ar }
      responses:
        '200':
          description: Mensaje uniforme (no revela si el email existe)
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensaje: { type: string }
        '400': { $ref: '#/components/responses/Error' }

  /password-reset/confirmar:
    post:
      tags: [auth]
      summary: Confirma el reset con el token y la nueva contraseña (público)
      description: >
        Valida el token de un solo uso (existe, no expiró, no se usó), lo consume y actualiza la
        contraseña (bcrypt). Sirve tanto para docentes como estudiantes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:    { type: string }
                password: { type: string }
      responses:
        '200':
          description: Contraseña actualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensaje: { type: string }
        '400': { $ref: '#/components/responses/Error' }

  /me:
    get:
      tags: [auth]
      summary: Identidad y permisos efectivos del usuario autenticado
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Identidad
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Identidad' }
        '401': { $ref: '#/components/responses/Error' }

  /docentes:
    get:
      tags: [docentes]
      summary: Lista docentes (permiso docentes.leer)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Lista de docentes
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Docente' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [docentes]
      summary: Crea un docente (permiso docentes.gestionar). Genera contraseña automática y envía email de bienvenida.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocenteInput' }
      responses:
        '201':
          description: Docente creado (se envía email con contraseña generada)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Docente' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /docentes/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      tags: [docentes]
      summary: Obtiene un docente (permiso docentes.leer)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Docente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Docente' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      tags: [docentes]
      summary: Actualiza un docente (permiso docentes.gestionar)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocenteInput' }
      responses:
        '200':
          description: Docente actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Docente' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      tags: [docentes]
      summary: Elimina un docente (borrado lógico, setea activo=False, permiso docentes.gestionar)
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Docente desactivado (borrado lógico) }
        '404': { $ref: '#/components/responses/Error' }

  /docentes/{id}/permisos:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    put:
      tags: [docentes]
      summary: Setea overrides de permisos del docente (permiso permisos.asignar)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OverridesInput' }
      responses:
        '200':
          description: Overrides aplicados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OverridesResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /estudiantes:
    get:
      tags: [estudiantes]
      summary: Lista estudiantes inscriptos en una cursada (permiso estudiantes.leer)
      description: >
        Lista los estudiantes inscriptos en la cursada indicada por `anio` + `cuatrimestre`
        (obligatorios), con filtros opcionales por `nombre`, `apellido`, `padron` y `email`
        (coincidencia parcial). Incluye datos de la inscripción (`recursa`, `estado`) y el histórico
        de bajas (`motivos_baja`).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: anio, in: query, required: true, schema: { type: integer, example: 2026 } }
        - { name: cuatrimestre, in: query, required: true, schema: { type: integer, enum: [1, 2], example: 2 } }
        - { name: q, in: query, required: false, description: 'Búsqueda única (OR): numérico → padrón+email; alfabético → nombre+apellido+email. Ignora los filtros por campo.', schema: { type: string } }
        - { name: nombre, in: query, required: false, schema: { type: string } }
        - { name: apellido, in: query, required: false, schema: { type: string } }
        - { name: padron, in: query, required: false, schema: { type: string } }
        - { name: email, in: query, required: false, schema: { type: string } }
        - { name: _offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: _limit, in: query, required: false, schema: { type: integer, minimum: 1, default: 10 } }
      responses:
        '200':
          description: Estudiantes de la cursada (paginado)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EstudiantesPaginado' }
        '204': { description: Sin estudiantes para los filtros indicados }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [estudiantes]
      summary: Crea un estudiante (permiso estudiantes.gestionar)
      description: >
        Crea el estudiante y lo inscribe en la cursada vigente (según la fecha actual), con estado
        'cursando'. Requiere que exista una cursada vigente (409 si no hay).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EstudianteInput' }
      responses:
        '201':
          description: Estudiante creado e inscripto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Estudiante' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { description: 'Padrón/email duplicado o no hay cursada vigente', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /estudiantes/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      tags: [estudiantes]
      summary: Obtiene un estudiante (permiso estudiantes.leer)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Estudiante
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Estudiante' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      tags: [estudiantes]
      summary: Actualiza un estudiante (permiso estudiantes.gestionar)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EstudianteInput' }
      responses:
        '200':
          description: Estudiante actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Estudiante' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /estudiantes/{id}/baja:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    post:
      tags: [estudiantes]
      summary: Baja lógica / abandono de la inscripción en la cursada vigente
      description: >
        Cambia el estado de la inscripción del estudiante en la cursada vigente. `estado` ∈
        `cursando` | `abandono` | `baja`. El `motivo` es obligatorio sólo cuando `estado` es `baja`
        (para el resto se ignora). No borra la persona ni la inscripción (baja lógica).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado]
              properties:
                estado: { type: string, enum: [cursando, abandono, baja], example: baja }
                motivo: { type: string, example: 'No cumplió la regularidad' }
      responses:
        '200':
          description: Estado de inscripción actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  estudiante_id: { type: integer, example: 7 }
                  cursada_id:    { type: integer, example: 9 }
                  estado:        { type: string, example: baja }
                  motivo_baja:   { type: string, nullable: true, example: 'No cumplió la regularidad' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /estudiantes/{id}/permisos:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    put:
      tags: [estudiantes]
      summary: Setea overrides de permisos del estudiante (permiso permisos.asignar)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OverridesInput' }
      responses:
        '200':
          description: Overrides aplicados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OverridesResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /estudiantes/csv:
    post:
      tags: [estudiantes]
      summary: Alta masiva de estudiantes por CSV (permiso estudiantes.gestionar)
      description: >
        Sube el CSV del detalle de inscripción (export SIU) como multipart/form-data en el campo
        `archivo`. Separador `;`, con cabecera; usa las columnas `Legajo`, `Alumno`
        ("Apellido, Nombre") y `Email` (admite el prefijo "Email Principal: "). Crea los estudiantes
        nuevos (password inicial = padrón) y **los inscribe en la cursada vigente** (los ya
        existentes no se recrean pero también se inscriben, con `recursa=true` si ya tenían
        inscripción en otra cursada). Omite los ya inscriptos en la cursada vigente y reporta las
        filas inválidas. Requiere una cursada vigente (409 si no hay).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                archivo: { type: string, format: binary }
      responses:
        '201':
          description: Resumen de la importación
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportCsvResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /cursadas:
    get:
      tags: [cursadas]
      summary: Lista los cursos/cursadas (permiso cursadas.leer)
      description: >
        Lista las cursadas con su materia (código + nombre), año, cuatrimestre y fechas. Filtros
        opcionales `codigo` (materia, parcial), `anio`, `cuatrimestre`, y paginación `_offset`/`_limit`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: codigo, in: query, required: false, schema: { type: string, example: TB022 } }
        - { name: anio, in: query, required: false, schema: { type: integer, example: 2026 } }
        - { name: cuatrimestre, in: query, required: false, schema: { type: integer, enum: [1, 2] } }
        - { name: _offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: _limit, in: query, required: false, schema: { type: integer, minimum: 1, default: 10 } }
      responses:
        '200':
          description: Cursos (paginado)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CursadasPaginado' }
        '204': { description: Sin cursadas para los filtros indicados }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /cursadas/{cursadaId}/clases:
    parameters:
      - { name: cursadaId, in: path, required: true, schema: { type: integer, example: 9 } }
    post:
      tags: [asistencias]
      summary: Dispara la toma de asistencia de una fecha (permiso asistencias.gestionar)
      description: >
        Crea (o reusa, idempotente) la clase de la fecha y genera un código/QR por cada estudiante
        inscripto y activo de la cursada. No envía los emails (eso es `/clases/{id}/enviar-qrs`).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fecha]
              properties:
                fecha:  { type: string, format: date, example: '2026-09-01' }
                titulo: { type: string, nullable: true, example: 'Clase 1' }
      responses:
        '201':
          description: Clase creada y códigos generados
          content:
            application/json:
              schema:
                type: object
                properties:
                  clase:             { $ref: '#/components/schemas/Clase' }
                  total_estudiantes: { type: integer, example: 120 }
                  generados:         { type: integer, example: 120 }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    get:
      tags: [asistencias]
      summary: Lista las clases con toma de asistencia de la cursada (permiso asistencias.leer)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: _offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: _limit, in: query, required: false, schema: { type: integer, minimum: 1, default: 10 } }
      responses:
        '200':
          description: Clases (paginado)
          content:
            application/json:
              schema:
                type: object
                properties:
                  clases: { type: array, items: { $ref: '#/components/schemas/Clase' } }
                  _links: { type: object }
        '204': { description: Sin clases }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /clases:
    get:
      tags: [asistencias]
      summary: Lista las clases de una materia/cursada (permiso asistencias.leer)
      description: >
        Lista las clases de una materia. `materia` (código) es obligatorio; `cursada`
        (id) es opcional y, si no se envía, se usa la cursada vigente de esa materia.
        Devuelve `id`, `fecha` y `titulo` de cada clase, paginado.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: materia, in: query, required: true, schema: { type: string, example: TB022 }, description: 'Código de la materia' }
        - { name: cursada, in: query, required: false, schema: { type: integer, example: 9 }, description: 'Id de la cursada (opcional; por defecto la vigente)' }
        - { name: _offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: _limit, in: query, required: false, schema: { type: integer, minimum: 1, default: 10 } }
      responses:
        '200':
          description: Clases de la materia/cursada (paginado)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClasesPaginado' }
        '204': { description: Sin clases }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /asistencias:
    get:
      tags: [asistencias]
      summary: Busca asistencias por materia/cursada/fechas/padrón (permiso asistencias.leer)
      description: >
        Busca asistencias de una materia. `materia` (código) es obligatorio; `cursada` (id) es
        opcional (por defecto la vigente). `desde`/`hasta` filtran por rango de fechas de clase;
        si no se envían, se usan las asistencias de la última clase. `padron` filtra por padrón
        exacto del estudiante.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: materia, in: query, required: true, schema: { type: string, example: TB022 }, description: 'Código de la materia' }
        - { name: cursada, in: query, required: false, schema: { type: integer, example: 9 }, description: 'Id de la cursada (opcional; por defecto la vigente)' }
        - { name: desde, in: query, required: false, schema: { type: string, format: date, example: '2026-09-01' }, description: 'Fecha inicio del rango (opcional)' }
        - { name: hasta, in: query, required: false, schema: { type: string, format: date, example: '2026-09-30' }, description: 'Fecha fin del rango (opcional)' }
        - { name: padron, in: query, required: false, schema: { type: string, example: '116530' }, description: 'Padrón del estudiante (opcional)' }
        - { name: _offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: _limit, in: query, required: false, schema: { type: integer, minimum: 1, default: 10 } }
      responses:
        '200':
          description: Asistencias encontradas (paginado)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AsistenciasBusquedaPaginado' }
        '204': { description: Sin asistencias para los filtros indicados }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /clases/{claseId}/enviar-qrs:
    parameters:
      - { name: claseId, in: path, required: true, schema: { type: integer, example: 5 } }
    post:
      tags: [asistencias]
      summary: Envía el próximo lote de QRs por email (permiso asistencias.gestionar)
      description: >
        Envía por email el próximo lote de QRs pendientes (no enviados, con menos del máximo de
        intentos). Reanudable e idempotente: reintentar continúa por los que faltan. El front lo
        llama en bucle (con `/clases/{id}/envio` para el progreso) hasta `completo = true`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: limite, in: query, required: false, schema: { type: integer, minimum: 1 }, description: Tamaño del lote (default ASISTENCIA_LOTE_EMAILS) }
      responses:
        '200':
          description: Resumen del envío
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvioResumen' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /clases/{claseId}/envio:
    parameters:
      - { name: claseId, in: path, required: true, schema: { type: integer, example: 5 } }
    get:
      tags: [asistencias]
      summary: Progreso del envío de QRs (permiso asistencias.leer)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Estado del envío
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvioResumen' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /clases/{claseId}/marcar:
    parameters:
      - { name: claseId, in: path, required: true, schema: { type: integer, example: 5 } }
    post:
      tags: [asistencias]
      summary: Marca presente por QR/código o padrón (permiso asistencias.gestionar)
      description: >
        Marca 'presente' una asistencia. Enviar exactamente uno de `codigo` (del QR escaneado o
        tipeado; con `manual: true` si fue tipeado) o `padron` (fallback). La clase debe estar abierta.
        Al confirmarse, se envía un email al estudiante con el template `asistencia_confirmada.html`;
        si la asistencia ya estaba confirmada, se retorna sin reenviar el email.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                codigo: { type: string, example: 'ABCD2345' }
                manual: { type: boolean, example: false, description: 'true si el código se tipeó a mano' }
                padron: { type: string, example: '116530' }
      responses:
        '200':
          description: Asistencia marcada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarcaAsistencia' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /clases/{claseId}/asistencias:
    parameters:
      - { name: claseId, in: path, required: true, schema: { type: integer, example: 5 } }
    get:
      tags: [asistencias]
      summary: Lista las asistencias de una clase (permiso asistencias.leer)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: estado, in: query, required: false, schema: { type: string, enum: [pendiente, presente, ausente] } }
        - { name: q, in: query, required: false, schema: { type: string }, description: Búsqueda por nombre/apellido/padrón/email }
        - { name: _offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: _limit, in: query, required: false, schema: { type: integer, minimum: 1, default: 10 } }
      responses:
        '200':
          description: Asistencias (paginado)
          content:
            application/json:
              schema:
                type: object
                properties:
                  asistencias: { type: array, items: { $ref: '#/components/schemas/Asistencia' } }
                  _links: { type: object }
        '204': { description: Sin asistencias }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /clases/{claseId}/cerrar:
    parameters:
      - { name: claseId, in: path, required: true, schema: { type: integer, example: 5 } }
    post:
      tags: [asistencias]
      summary: Cierra la clase; los pendientes pasan a ausentes (permiso asistencias.gestionar)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Clase cerrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  clase_id:          { type: integer, example: 5 }
                  estado:            { type: string, example: cerrada }
                  marcados_ausentes: { type: integer, example: 74 }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /roles:
    get:
      tags: [roles]
      summary: Lista los roles con sus permisos (permiso roles.gestionar)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Roles con permisos
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Rol' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /permisos:
    get:
      tags: [roles]
      summary: Catálogo de permisos (permiso roles.leer)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Catálogo de permisos
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Permiso' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /roles/{codigo}/permisos:
    parameters:
      - { name: codigo, in: path, required: true, schema: { type: string, example: admin } }
    put:
      tags: [roles]
      summary: Reemplaza los permisos de un rol (permiso roles.gestionar)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PermisosRolInput' }
      responses:
        '200':
          description: Permisos del rol actualizados
          content:
            application/json:
              schema:
                type: object
                properties:
                  codigo:   { type: string, example: admin }
                  permisos: { type: array, items: { type: string }, example: [docentes.leer, estudiantes.leer] }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:    { type: string, example: bruno@fi.uba.ar }
        password: { type: string, example: mi-password }

    LoginResponse:
      type: object
      properties:
        token: { type: string, example: 'eyJhbGciOi...' }
        usuario:
          type: object
          properties:
            id:    { type: integer, example: 1 }
            tipo:  { type: string, example: docente }
            email: { type: string, example: bruno@fi.uba.ar }
            rol:   { type: string, example: super_admin }

    Identidad:
      type: object
      properties:
        id:       { type: integer, example: 1 }
        tipo:     { type: string, enum: [docente, estudiante], example: docente }
        email:    { type: string, example: bruno@fi.uba.ar }
        rol:      { type: string, enum: [super_admin, admin, usuario], example: super_admin }
        permisos: { type: array, items: { type: string }, example: [docentes.leer, estudiantes.leer] }

    Docente:
      type: object
      properties:
        id:         { type: integer, example: 1 }
        nombre:     { type: string, example: Bruno }
        apellido:   { type: string, example: Lanzillotta }
        email:      { type: string, example: bruno@fi.uba.ar }
        rol:        { type: string, enum: [Profesor, Ayudante, Colaborador], example: Profesor }
        foto:       { type: string, nullable: true }
        activo:     { type: boolean, example: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    DocenteInput:
      type: object
      required: [nombre, apellido, email, rol]
      properties:
        nombre:   { type: string, maxLength: 100 }
        apellido: { type: string, maxLength: 100 }
        email:    { type: string }
        rol:      { type: string, enum: [Profesor, Ayudante, Colaborador] }
        foto:     { type: string, nullable: true }

    ImportCsvResponse:
      type: object
      properties:
        estudiantes_creados: { type: integer, example: 248, description: 'Estudiantes nuevos creados' }
        inscriptos:          { type: integer, example: 250, description: 'Inscripciones creadas en la cursada vigente' }
        omitidos:
          type: array
          description: Filas ya inscriptas en la cursada vigente o duplicadas en el archivo
          items:
            type: object
            properties:
              padron: { type: string, example: '111' }
              motivo: { type: string, example: 'ya inscripto en la cursada vigente' }
        errores:
          type: array
          items:
            type: object
            properties:
              fila:   { type: integer, example: 5 }
              motivo: { type: string, example: 'Email inválido: -' }

    Estudiante:
      type: object
      properties:
        id:         { type: integer, example: 1 }
        padron:     { type: string, example: '116530' }
        nombre:     { type: string, example: Ian }
        apellido:   { type: string, example: Acosta }
        email:      { type: string, example: ian@fi.uba.ar }
        activo:     { type: boolean, example: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PaginacionLinks:
      type: object
      description: Links HATEOAS de navegación (según la posición en la colección)
      properties:
        _first: { type: object, properties: { href: { type: string } } }
        _prev:  { type: object, properties: { href: { type: string } } }
        _next:  { type: object, properties: { href: { type: string } } }
        _last:  { type: object, properties: { href: { type: string } } }

    Curso:
      type: object
      properties:
        codigo:       { type: string, example: TB022 }
        nombre:       { type: string, example: Introducción al Desarrollo de Software }
        anio:         { type: integer, example: 2026 }
        cuatrimestre: { type: integer, example: 2 }
        fecha_inicio: { type: string, format: date, example: '2026-08-01' }
        fecha_fin:    { type: string, format: date, example: '2026-12-15' }
        vigente:      { type: boolean, description: 'true si la cursada transcurre hoy (inicio ≤ hoy ≤ fin)', example: true }

    CursadasPaginado:
      type: object
      properties:
        cursadas:
          type: array
          items: { $ref: '#/components/schemas/Curso' }
        _links: { $ref: '#/components/schemas/PaginacionLinks' }

    EstudiantesPaginado:
      type: object
      properties:
        estudiantes:
          type: array
          items: { $ref: '#/components/schemas/EstudianteEnCursada' }
        _links: { $ref: '#/components/schemas/PaginacionLinks' }

    EstudianteEnCursada:
      type: object
      properties:
        id:       { type: integer, example: 1 }
        padron:   { type: string, example: '116530' }
        nombre:   { type: string, example: Ian }
        apellido: { type: string, example: Acosta }
        email:    { type: string, example: ian@fi.uba.ar }
        recursa:  { type: boolean, example: false }
        estado:   { type: string, enum: [cursando, abandono, baja], example: cursando }
        motivos_baja:
          type: array
          description: Histórico de bajas del estudiante (todas las cursadas)
          items:
            type: object
            properties:
              anio:         { type: integer, example: 2025 }
              cuatrimestre: { type: integer, example: 1 }
              motivo:       { type: string, example: 'No cumplió la regularidad' }

    EstudianteInput:
      type: object
      required: [padron, nombre, apellido, email, password]
      properties:
        padron:   { type: string, maxLength: 20 }
        nombre:   { type: string, maxLength: 100 }
        apellido: { type: string, maxLength: 100 }
        email:    { type: string }
        password: { type: string, description: 'Obligatorio al crear; opcional al actualizar' }

    Clase:
      type: object
      properties:
        id:         { type: integer, example: 5 }
        cursada_id: { type: integer, example: 9 }
        fecha:      { type: string, format: date, example: '2026-09-01' }
        titulo:     { type: string, nullable: true, example: 'Clase 1' }
        estado:     { type: string, enum: [abierta, cerrada], example: abierta }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time, nullable: true }

    ClaseResumida:
      type: object
      properties:
        id:     { type: integer, example: 5 }
        fecha:  { type: string, format: date, example: '2026-09-01' }
        titulo: { type: string, nullable: true, example: 'Clase 1' }

    ClasesPaginado:
      type: object
      properties:
        clases:
          type: array
          items: { $ref: '#/components/schemas/ClaseResumida' }
        _links: { $ref: '#/components/schemas/PaginacionLinks' }

    EnvioResumen:
      type: object
      properties:
        clase_id:         { type: integer, example: 5 }
        total:            { type: integer, example: 120 }
        enviados:         { type: integer, example: 45 }
        con_error:        { type: integer, example: 1 }
        quedan:           { type: integer, example: 74 }
        completo:         { type: boolean, example: false }
        enviados_en_lote: { type: integer, example: 15, description: 'Sólo en POST /enviar-qrs' }

    Asistencia:
      type: object
      properties:
        estudiante_id: { type: integer, example: 3 }
        padron:        { type: string, example: '116530' }
        nombre:        { type: string, example: Ana }
        apellido:      { type: string, example: Perez }
        email:         { type: string, example: ana@fi.uba.ar }
        codigo:        { type: string, example: 'ABCD2345' }
        estado:        { type: string, enum: [pendiente, presente, ausente] }
        metodo:        { type: string, nullable: true, enum: [qr, manual, padron] }
        marcado_at:    { type: string, format: date-time, nullable: true }
        enviado:       { type: boolean, example: true }

    AsistenciaBusqueda:
      type: object
      properties:
        clase_id:      { type: integer, example: 5 }
        fecha:         { type: string, format: date, example: '2026-09-01' }
        titulo:        { type: string, nullable: true, example: 'Clase 1' }
        estudiante_id: { type: integer, example: 3 }
        padron:        { type: string, example: '116530' }
        nombre:        { type: string, example: Ana }
        apellido:      { type: string, example: Perez }
        email:         { type: string, example: ana@fi.uba.ar }
        estado:        { type: string, enum: [pendiente, presente, ausente] }
        metodo:        { type: string, nullable: true, enum: [qr, manual, padron] }
        marcado_at:    { type: string, format: date-time, nullable: true }

    AsistenciasBusquedaPaginado:
      type: object
      properties:
        asistencias:
          type: array
          items: { $ref: '#/components/schemas/AsistenciaBusqueda' }
        _links: { $ref: '#/components/schemas/PaginacionLinks' }

    MarcaAsistencia:
      type: object
      properties:
        clase_id:      { type: integer, example: 5 }
        estudiante_id: { type: integer, example: 3 }
        padron:        { type: string, example: '116530' }
        nombre:        { type: string, example: Ana }
        apellido:      { type: string, example: Perez }
        estado:        { type: string, example: presente }
        metodo:        { type: string, enum: [qr, manual, padron], example: qr }

    Rol:
      type: object
      properties:
        codigo:      { type: string, example: admin }
        nombre:      { type: string, example: Admin }
        descripcion: { type: string, nullable: true }
        permisos:    { type: array, items: { type: string }, example: [docentes.leer, estudiantes.leer] }

    Permiso:
      type: object
      properties:
        codigo:      { type: string, example: docentes.gestionar }
        descripcion: { type: string, nullable: true }

    PermisosRolInput:
      type: object
      required: [permisos]
      properties:
        permisos:
          type: array
          items: { type: string }
          example: [docentes.leer, estudiantes.leer, estudiantes.gestionar]

    OverridesInput:
      type: object
      required: [permisos]
      properties:
        permisos:
          type: array
          items:
            type: object
            properties:
              permiso:   { type: string, example: docentes.gestionar }
              concedido: { type: boolean, example: true }

    OverridesResponse:
      type: object
      properties:
        docente_id:    { type: integer, nullable: true }
        estudiante_id: { type: integer, nullable: true }
        permisos:
          type: array
          items:
            type: object
            properties:
              codigo:    { type: string }
              concedido: { type: boolean }

    Error:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              code:        { type: string, example: auth.forbidden }
              message:     { type: string, example: 'Permiso insuficiente' }
              level:       { type: string, example: error }
              description: { type: string }
