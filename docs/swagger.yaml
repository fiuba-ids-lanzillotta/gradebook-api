openapi: 3.0.3
info:
  title: gradebook-api
  description: >
    API REST en Flask con autenticación propia (JWT) y control de acceso por roles y permisos
    (RBAC). Personas: docentes y estudiantes (login por email). El rol de seguridad se deriva
    (docente por cargo, estudiante = usuario) y los permisos se configuran por rol y por usuario.
    Arquitectura en capas routes / services / validators / db con backend Supabase.
  version: 2.0.0

servers:
  - url: http://localhost:5000/gradebook_api
    description: Desarrollo local

tags:
  - name: auth
    description: Autenticación (login por email + password)
  - name: docentes
    description: Gestión de docentes
  - name: estudiantes
    description: Gestión de estudiantes
  - name: cursadas
    description: Cursos / cursadas de una materia
  - name: asistencias
    description: Asistencia por QR (clases, envío de QRs y marcado)
  - name: roles
    description: Roles y catálogo de permisos (RBAC)
  - name: grupos
    description: Equipos de una evaluación grupal
  - name: evaluaciones
    description: Evaluaciones e instancias (fechas/convocatorias donde se rinde o entrega)
  - name: registros
    description: Registro de auditoría de acciones (backoffice)

paths:
  /login:
    post:
      tags: [auth]
      summary: Login por email + password (docente o estudiante)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Login correcto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /password-reset/solicitar:
    post:
      tags: [auth]
      summary: Solicita el email de recuperación de contraseña (público)
      description: >
        Si el email corresponde a un docente o estudiante, envía un email con un enlace de un solo
        uso (token opaco en Redis, TTL 30 min) para restablecer la contraseña. Responde **siempre**
        el mismo mensaje, exista o no el email (no permite enumerar usuarios).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, example: docente@fi.uba.ar }
      responses:
        '200':
          description: Mensaje uniforme (no revela si el email existe)
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensaje: { type: string }
        '400': { $ref: '#/components/responses/Error' }

  /password-reset/confirmar:
    post:
      tags: [auth]
      summary: Confirma el reset con el token y la nueva contraseña (público)
      description: >
        Valida el token de un solo uso (existe, no expiró, no se usó), lo consume y actualiza la
        contraseña (bcrypt). Sirve tanto para docentes como estudiantes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:    { type: string }
                password: { type: string }
      responses:
        '200':
          description: Contraseña actualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensaje: { type: string }
        '400': { $ref: '#/components/responses/Error' }

  /me:
    get:
      tags: [auth]
      summary: Identidad y permisos efectivos del usuario autenticado
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Identidad
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Identidad' }
        '401': { $ref: '#/components/responses/Error' }

  /docentes:
    get:
      tags: [docentes]
      summary: Lista docentes (permiso docentes.leer)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Lista de docentes
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Docente' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [docentes]
      summary: Crea un docente (permiso docentes.gestionar). Genera contraseña automática y envía email de bienvenida.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocenteInput' }
      responses:
        '201':
          description: Docente creado (se envía email con contraseña generada)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Docente' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /docentes/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      tags: [docentes]
      summary: Obtiene un docente (permiso docentes.leer)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Docente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Docente' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      tags: [docentes]
      summary: Actualiza un docente (permiso docentes.gestionar)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocenteInput' }
      responses:
        '200':
          description: Docente actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Docente' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      tags: [docentes]
      summary: Elimina un docente (borrado lógico, setea activo=False, permiso docentes.gestionar)
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Docente desactivado (borrado lógico) }
        '404': { $ref: '#/components/responses/Error' }

  /docentes/{id}/permisos:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    put:
      tags: [docentes]
      summary: Setea overrides de permisos del docente (permiso permisos.asignar)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OverridesInput' }
      responses:
        '200':
          description: Overrides aplicados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OverridesResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /estudiantes:
    get:
      tags: [estudiantes]
      summary: Lista estudiantes inscriptos en una cursada (permiso estudiantes.leer)
      description: >
        Lista los estudiantes inscriptos en la cursada indicada por `anio` + `cuatrimestre`
        (obligatorios), con filtros opcionales por `nombre`, `apellido`, `padron` y `email`
        (coincidencia parcial). Incluye datos de la inscripción (`recursa`, `estado`) y el histórico
        de bajas (`motivos_baja`).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: anio, in: query, required: true, schema: { type: integer, example: 2026 } }
        - { name: cuatrimestre, in: query, required: true, schema: { type: integer, enum: [1, 2], example: 2 } }
        - { name: q, in: query, required: false, description: 'Búsqueda única (OR): numérico → padrón+email; alfabético → nombre+apellido+email. Ignora los filtros por campo.', schema: { type: string } }
        - { name: nombre, in: query, required: false, schema: { type: string } }
        - { name: apellido, in: query, required: false, schema: { type: string } }
        - { name: padron, in: query, required: false, schema: { type: string } }
        - { name: email, in: query, required: false, schema: { type: string } }
        - { name: _offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: _limit, in: query, required: false, schema: { type: integer, minimum: 1, default: 10 } }
      responses:
        '200':
          description: Estudiantes de la cursada (paginado)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EstudiantesPaginado' }
        '204': { description: Sin estudiantes para los filtros indicados }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [estudiantes]
      summary: Crea un estudiante (permiso estudiantes.gestionar)
      description: >
        Crea el estudiante y lo inscribe en la cursada indicada por `cursada_id` (opcional;
        la que el front tiene seleccionada en el panel) o, en su defecto, en la cursada vigente
        según la fecha actual — con estado 'cursando'. Requiere que exista una cursada destino
        (404 si `cursada_id` no existe, 409 si no hay vigente).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EstudianteInput' }
      responses:
        '201':
          description: Estudiante creado e inscripto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Estudiante' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { description: 'Padrón/email duplicado o no hay cursada vigente', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /estudiantes/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      tags: [estudiantes]
      summary: Obtiene un estudiante (permiso estudiantes.leer)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Estudiante
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Estudiante' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      tags: [estudiantes]
      summary: Actualiza un estudiante (permiso estudiantes.gestionar)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EstudianteInput' }
      responses:
        '200':
          description: Estudiante actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Estudiante' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /estudiantes/{id}/baja:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    post:
      tags: [estudiantes]
      summary: Baja lógica / abandono de la inscripción en la cursada vigente
      description: >
        Cambia el estado de la inscripción del estudiante en la cursada indicada por
        `cursada_id` (opcional; por defecto la vigente). `estado` ∈
        `abandono` | `baja`. El `motivo` es obligatorio sólo cuando `estado` es `baja`
        (para el resto se ignora). No borra la persona ni la inscripción (baja lógica).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado]
              properties:
                estado:     { type: string, enum: [abandono, baja], example: baja }
                motivo:     { type: string, example: 'No cumplió la regularidad' }
                cursada_id: { type: integer, minimum: 1, description: 'Cursada destino; por defecto la vigente' }
      responses:
        '200':
          description: Estado de inscripción actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  estudiante_id: { type: integer, example: 7 }
                  cursada_id:    { type: integer, example: 9 }
                  estado:        { type: string, example: baja }
                  motivo_baja:   { type: string, nullable: true, example: 'No cumplió la regularidad' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /estudiantes/{id}/reactivacion:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    post:
      tags: [estudiantes]
      summary: Reactiva la inscripción en la cursada vigente (permiso estudiantes.reactivar)
      description: >
        Reactiva la inscripción del estudiante en la cursada indicada por `cursada_id`
        (opcional; por defecto la vigente). Solo está permitido si la inscripción actual
        está en estado `baja`; de lo contrario devuelve 409.
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                cursada_id: { type: integer, minimum: 1, description: 'Cursada destino; por defecto la vigente' }
      responses:
        '200':
          description: Inscripción reactivada
          content:
            application/json:
              schema:
                type: object
                properties:
                  estudiante_id: { type: integer, example: 7 }
                  cursada_id:    { type: integer, example: 9 }
                  estado:        { type: string, example: cursando }
                  motivo_baja:   { type: 'null' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /estudiantes/{id}/permisos:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    put:
      tags: [estudiantes]
      summary: Setea overrides de permisos del estudiante (permiso permisos.asignar)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OverridesInput' }
      responses:
        '200':
          description: Overrides aplicados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OverridesResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /estudiantes/csv:
    post:
      tags: [estudiantes]
      summary: Alta masiva de estudiantes por CSV (permiso estudiantes.gestionar)
      description: >
        Sube el CSV del detalle de inscripción (export SIU) como multipart/form-data en el campo
        `archivo`. Separador `;`, con cabecera; usa las columnas `Legajo`, `Alumno`
        ("Apellido, Nombre") y `Email` (admite el prefijo "Email Principal: "). Crea los estudiantes
        nuevos (password inicial = padrón) y **los inscribe en la cursada indicada por el campo
        de formulario `cursada_id`** (opcional; por defecto la vigente) — los ya
        existentes no se recrean pero también se inscriben, con `recursa=true` si ya tenían
        inscripción en otra cursada. Omite los ya inscriptos en la cursada destino y reporta las
        filas inválidas. Requiere una cursada destino (409 si no hay vigente).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                archivo:    { type: string, format: binary }
                cursada_id: { type: integer, minimum: 1, description: 'Cursada destino; por defecto la vigente' }
      responses:
        '201':
          description: Resumen de la importación
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportCsvResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /cursadas:
    get:
      tags: [cursadas]
      summary: Lista los cursos/cursadas (permiso cursadas.leer)
      description: >
        Lista las cursadas con su materia (código + nombre), año, cuatrimestre y fechas. Filtros
        opcionales `codigo` (materia, parcial), `anio`, `cuatrimestre`, y paginación `_offset`/`_limit`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: codigo, in: query, required: false, schema: { type: string, example: TB022 } }
        - { name: anio, in: query, required: false, schema: { type: integer, example: 2026 } }
        - { name: cuatrimestre, in: query, required: false, schema: { type: integer, enum: [1, 2] } }
        - { name: _offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: _limit, in: query, required: false, schema: { type: integer, minimum: 1, default: 10 } }
      responses:
        '200':
          description: Cursos (paginado)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CursadasPaginado' }
        '204': { description: Sin cursadas para los filtros indicados }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [cursadas]
      summary: Alta de cursada (permiso cursadas.crear, solo super_admin)
      description: >
        Crea una cursada. Si la materia con el `codigo` dado no existe, se crea.
        Las fechas deben estar dentro del cuatrimestre y del año indicados.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CursadaInput' }
      responses:
        '201':
          description: Cursada creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Curso' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /cursadas/{cursadaId}:
    parameters:
      - { name: cursadaId, in: path, required: true, schema: { type: integer, minimum: 1 } }
    put:
      tags: [cursadas]
      summary: Modificación de cursada (permiso cursadas.modificar, solo super_admin)
      description: >
        Actualiza una cursada. El `codigo` debe coincidir con la materia actual;
        no se puede cambiar la materia por este endpoint.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CursadaInput' }
      responses:
        '200':
          description: Cursada actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Curso' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /materias:
    get:
      tags: [materias]
      summary: Catálogo de materias (permiso cursadas.leer)
      description: >
        Lista todas las materias ordenadas por código. Es el catálogo que usa el
        backoffice para autocompletar el código/nombre al crear una cursada.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Materias ordenadas por código
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Materia' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /me/equipo:
    get:
      tags: [grupos]
      summary: Equipo del alumno en la evaluación con creación habilitada
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: El equipo, o vacío si todavía puede crear uno }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [grupos]
      summary: El alumno crea su equipo en esa evaluación. Body {nombre, padrones?}
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Equipo creado }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    put:
      tags: [grupos]
      summary: El owner renombra su equipo. Body {nombre}
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Equipo actualizado }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /me/equipo/salir:
    post:
      tags: [grupos]
      summary: El alumno deja su equipo. Si es el owner y hay otros, la corona pasa a uno al azar
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Salió del equipo }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /me/equipo/integrantes:
    post:
      tags: [grupos]
      summary: El owner suma un alumno por padrón. Body {padron}
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Integrante agregado }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /me/notas:
    get:
      tags: [notas]
      summary: Calificaciones del alumno (solo alumnos — bearer token de estudiante)
      description: >
        Las notas individuales del alumno más las de los equipos que integra, ordenadas
        por evaluación e instancia. Cada ítem trae la evaluación, la instancia (número,
        nombre y fecha), la nota o el estado según el criterio de la evaluación, las
        observaciones del corrector, el corrector y el equipo (null si es individual).
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Lista de calificaciones (puede venir vacía)
          content:
            application/json:
              schema:
                type: object
                properties:
                  notas:
                    type: array
                    items:
                      type: object
                      properties:
                        evaluacion: { type: object, properties: {
                          id: { type: integer }, nombre: { type: string },
                          modalidad: { type: string }, criterio: { type: string },
                          cursada_id: { type: integer } } }
                        instancia: { type: object, properties: {
                          id: { type: integer }, numero: { type: integer },
                          nombre: { type: string }, fecha: { type: string, format: date, nullable: true } } }
                        equipo: { type: object, nullable: true, properties: {
                          id: { type: integer }, nombre: { type: string } } }
                        nota: { type: number, nullable: true }
                        estado: { type: string, nullable: true }
                        observaciones: { type: string, nullable: true }
                        corrector: { type: object, nullable: true, properties: {
                          id: { type: integer }, nombre: { type: string }, apellido: { type: string } } }
                        corregido_at: { type: string, format: date-time, nullable: true }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /cursadas/{cursadaId}/grupos:
    get:
      tags: [grupos]
      summary: Equipos de las evaluaciones grupales de la cursada (estudiantes.leer)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: cursadaId, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Equipos con cantidad de integrantes, tutor y requiere_corrector de la evaluación }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /grupos/tutores:
    put:
      tags: [grupos]
      summary: Asigna tutores de varios equipos (estudiantes.modificar)
      description: >
        tutor_id null deja el equipo sin tutor (siempre permitido). Asignar un
        tutor a un equipo cuya evaluación tiene requiere_corrector=false responde
        400: el tutor es quien corrige, sin corrector no hay tutor.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Cantidad actualizada y cuántos quedaron sin tutor }
        '400': { $ref: '#/components/responses/Error' }

  /grupos/{grupoId}:
    get:
      tags: [grupos]
      summary: Detalle del equipo (estudiantes.leer)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: grupoId, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Integrantes, candidatos y otros equipos de la evaluación }
        '404': { $ref: '#/components/responses/Error' }
    put:
      tags: [grupos]
      summary: Renombra el equipo (estudiantes.modificar)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: grupoId, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Equipo actualizado }
        '400': { $ref: '#/components/responses/Error' }

  /grupos/{grupoId}/integrantes:
    post:
      tags: [grupos]
      summary: Suma un alumno al equipo (estudiantes.modificar)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: grupoId, in: path, required: true, schema: { type: integer } }
      responses:
        '201': { description: Equipo con el integrante nuevo }
        '409': { $ref: '#/components/responses/Error' }

  /grupos/{grupoId}/integrantes/{estudianteId}:
    delete:
      tags: [grupos]
      summary: Echa a un integrante (estudiantes.modificar)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: grupoId, in: path, required: true, schema: { type: integer } }
        - { name: estudianteId, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Equipo sin ese integrante }
        '409': { description: El owner es el único integrante }

  /grupos/{grupoId}/integrantes/{estudianteId}/transferir:
    post:
      tags: [grupos]
      summary: Mueve un integrante a otro equipo de la misma evaluación (estudiantes.modificar)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: grupoId, in: path, required: true, schema: { type: integer } }
        - { name: estudianteId, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Equipo de origen actualizado }
        '400': { $ref: '#/components/responses/Error' }

  /cursadas/{cursadaId}/evaluaciones:
    get:
      tags: [evaluaciones]
      summary: Categorías de la cursada, con la cantidad de instancias de cada una
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: cursadaId, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: '{evaluaciones: [{id, nombre, tipo, criterio, peso, modalidad, visibilidad, permite_crear_grupos, instancias}]}' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      tags: [evaluaciones]
      summary: Crea una categoría. Arranca deshabilitada y sin creación de equipos
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: cursadaId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, tipo, criterio, peso, modalidad, instancias]
              properties:
                nombre: { type: string }
                tipo: { type: string, enum: [obligatorio, opcional] }
                criterio: { type: string, enum: [nota, aprobado_desaprobado, entregado_no_entregado] }
                peso: { type: number, minimum: 0, maximum: 10 }
                modalidad: { type: string, enum: [grupal, individual] }
                instancias: { type: integer, minimum: 0, maximum: 20, description: Filas a crear en evaluacion_instancias }
                requiere_corrector: { type: boolean, description: Si falta, queda en true }
      responses:
        '201': { description: Categoría creada }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /evaluaciones/{evaluacionId}/crear-grupos:
    put:
      tags: [evaluaciones]
      summary: Abre o cierra la creación de equipos por los alumnos (grupos.habilitar — solo super_admin)
      description: >
        Solo una evaluación de la cursada puede tener la creación de equipos habilitada:
        al abrir una estando otra abierta, la abierta se cierra automáticamente y sus
        equipos se copian a la nueva (snapshot: mismo número, nombre, owner, tutor e
        integrantes; no copia nada si la destino ya tiene equipos). Sin abierta, el
        origen es la última evaluación grupal de la cursada que tuvo equipos.
        Solo aplica a evaluaciones de modalidad `grupal`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: evaluacionId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [habilitado]
              properties:
                habilitado: { type: boolean, example: true }
      responses:
        '200': { description: Evaluación actualizada ({id, cursada_id, nombre, modalidad, permite_crear_grupos}) }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /evaluaciones/{evaluacionId}/instancias:
    get:
      tags: [evaluaciones]
      summary: Instancias de la evaluación, ordenadas por número (evaluaciones.leer)
      description: >
        Una instancia es una fecha/convocatoria donde se rinde o entrega la evaluación
        (1er parcial, recuperatorios, entrega de TP). Las notas se cargan por instancia;
        la que vale para la evaluación es la de la última instancia rendida.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: evaluacionId, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Instancias de la evaluación
          content:
            application/json:
              schema:
                type: object
                properties:
                  instancias:
                    type: array
                    items: { $ref: '#/components/schemas/Instancia' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      tags: [evaluaciones]
      summary: Crea una instancia abierta (evaluaciones.gestionar)
      description: El número se asigna solo (siguiente dentro de la evaluación). Nace con estado `abierta`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: evaluacionId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstanciaCrear' }
      responses:
        '201':
          description: Instancia creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Instancia' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /instancias/{instanciaId}:
    put:
      tags: [evaluaciones]
      summary: Edita nombre, fecha o estado de la instancia (evaluaciones.gestionar)
      description: Acepta cualquier subconjunto de `nombre`/`fecha`/`estado`. `fecha: null` la limpia.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: instanciaId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstanciaActualizar' }
      responses:
        '200':
          description: Instancia actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Instancia' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /cursadas/{cursadaId}/clases:
    parameters:
      - { name: cursadaId, in: path, required: true, schema: { type: integer, example: 9 } }
    post:
      tags: [asistencias]
      summary: Dispara la toma de asistencia de una fecha (permiso asistencias.gestionar)
      description: >
        Crea (o reusa, idempotente) la clase de la fecha y genera un código/QR por cada estudiante
        inscripto y activo de la cursada. Si la clase ya existía, reencola los envíos de QR
        fallidos definitivos (los que agotaron el máximo de intentos) para que el próximo lote de
        `/clases/{id}/enviar-qrs` los reintente. No envía los emails (eso es `/clases/{id}/enviar-qrs`).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fecha]
              properties:
                fecha:  { type: string, format: date, example: '2026-09-01' }
                titulo: { type: string, nullable: true, example: 'Clase 1' }
      responses:
        '201':
          description: Clase creada y códigos generados
          content:
            application/json:
              schema:
                type: object
                properties:
                  clase:             { $ref: '#/components/schemas/Clase' }
                  total_estudiantes: { type: integer, example: 120 }
                  generados:         { type: integer, example: 120 }
                  reencolados:       { type: integer, example: 7, description: 'Envíos fallidos reencolados para reintento (solo si la clase ya existía)' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    get:
      tags: [asistencias]
      summary: Lista las clases con toma de asistencia de la cursada (permiso asistencias.leer)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: _offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: _limit, in: query, required: false, schema: { type: integer, minimum: 1, default: 10 } }
      responses:
        '200':
          description: Clases (paginado)
          content:
            application/json:
              schema:
                type: object
                properties:
                  clases: { type: array, items: { $ref: '#/components/schemas/Clase' } }
                  _links: { type: object }
        '204': { description: Sin clases }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /clases:
    get:
      tags: [asistencias]
      summary: Lista las clases de una materia/cursada (permiso asistencias.leer)
      description: >
        Lista las clases de una materia. `materia` (código) es obligatorio; `cursada`
        (id) es opcional y, si no se envía, se usa la cursada vigente de esa materia.
        Devuelve `id`, `fecha` y `titulo` de cada clase, paginado.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: materia, in: query, required: true, schema: { type: string, example: TB022 }, description: 'Código de la materia' }
        - { name: cursada, in: query, required: false, schema: { type: integer, example: 9 }, description: 'Id de la cursada (opcional; por defecto la vigente)' }
        - { name: _offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: _limit, in: query, required: false, schema: { type: integer, minimum: 1, default: 10 } }
      responses:
        '200':
          description: Clases de la materia/cursada (paginado)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClasesPaginado' }
        '204': { description: Sin clases }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /asistencias:
    get:
      tags: [asistencias]
      summary: Busca asistencias por materia/cursada/fechas/padrón (permiso asistencias.leer)
      description: >
        Busca asistencias de una materia. `materia` (código) es obligatorio; `cursada` (id) es
        opcional (por defecto la vigente). `desde`/`hasta` filtran por rango de fechas de clase;
        si no se envían, se usan las asistencias de la última clase. `padron` filtra por padrón
        exacto del estudiante.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: materia, in: query, required: true, schema: { type: string, example: TB022 }, description: 'Código de la materia' }
        - { name: cursada, in: query, required: false, schema: { type: integer, example: 9 }, description: 'Id de la cursada (opcional; por defecto la vigente)' }
        - { name: desde, in: query, required: false, schema: { type: string, format: date, example: '2026-09-01' }, description: 'Fecha inicio del rango (opcional)' }
        - { name: hasta, in: query, required: false, schema: { type: string, format: date, example: '2026-09-30' }, description: 'Fecha fin del rango (opcional)' }
        - { name: padron, in: query, required: false, schema: { type: string, example: '116530' }, description: 'Padrón del estudiante (opcional)' }
        - { name: _offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: _limit, in: query, required: false, schema: { type: integer, minimum: 1, default: 10 } }
      responses:
        '200':
          description: Asistencias encontradas (paginado)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AsistenciasBusquedaPaginado' }
        '204': { description: Sin asistencias para los filtros indicados }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /clases/{claseId}/enviar-qrs:
    parameters:
      - { name: claseId, in: path, required: true, schema: { type: integer, example: 5 } }
    post:
      tags: [asistencias]
      summary: Dispara el envío de los QRs pendientes por email (permiso asistencias.gestionar)
      description: >
        Encola para su envío por email los QRs pendientes (no enviados, con menos del máximo de
        intentos). Si la cola está configurada (QStash → gradebook-mailer), encola todos los
        pendientes en mensajes al worker y retorna; si no (modo dev), simula el envío marcando
        hasta `limite` asistencias como enviadas. Reanudable e idempotente: reintentar continúa
        por los que faltan. El front hace polling de `/clases/{id}/envio` hasta `completo = true`.
        Con `reintentar=true` primero reencola los envíos fallidos definitivos (los que agotaron
        el máximo de intentos) para darles otra tanda de intentos.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: limite, in: query, required: false, schema: { type: integer, minimum: 1 }, description: 'Tamaño del lote (default ASISTENCIA_LOTE_EMAILS); solo aplica al modo dev sin cola' }
        - { name: reintentar, in: query, required: false, schema: { type: boolean, default: false }, description: 'Si es true, reencola primero los envíos fallidos definitivos' }
      responses:
        '200':
          description: Resumen del envío
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvioResumen' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /clases/{claseId}/envio:
    parameters:
      - { name: claseId, in: path, required: true, schema: { type: integer, example: 5 } }
    get:
      tags: [asistencias]
      summary: Progreso del envío de QRs (permiso asistencias.leer)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Estado del envío
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvioResumen' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /clases/{claseId}/marcar:
    parameters:
      - { name: claseId, in: path, required: true, schema: { type: integer, example: 5 } }
    post:
      tags: [asistencias]
      summary: Marca presente por QR/código o padrón (permiso asistencias.gestionar)
      description: >
        Marca 'presente' una asistencia. Enviar exactamente uno de `codigo` (del QR escaneado o
        tipeado; con `manual: true` si fue tipeado) o `padron` (fallback). La clase debe estar abierta.
        Al confirmarse, se envía un email al estudiante con el template `asistencia_confirmada.html`;
        si la asistencia ya estaba confirmada, se retorna sin reenviar el email.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                codigo: { type: string, example: 'ABCD2345' }
                manual: { type: boolean, example: false, description: 'true si el código se tipeó a mano' }
                padron: { type: string, example: '116530' }
      responses:
        '200':
          description: Asistencia marcada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarcaAsistencia' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /clases/{claseId}/asistencias:
    parameters:
      - { name: claseId, in: path, required: true, schema: { type: integer, example: 5 } }
    get:
      tags: [asistencias]
      summary: Lista las asistencias de una clase (permiso asistencias.leer)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: estado, in: query, required: false, schema: { type: string, enum: [pendiente, presente, ausente] } }
        - { name: q, in: query, required: false, schema: { type: string }, description: Búsqueda por nombre/apellido/padrón/email }
        - { name: _offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: _limit, in: query, required: false, schema: { type: integer, minimum: 1, default: 10 } }
      responses:
        '200':
          description: Asistencias (paginado)
          content:
            application/json:
              schema:
                type: object
                properties:
                  asistencias: { type: array, items: { $ref: '#/components/schemas/Asistencia' } }
                  _links: { type: object }
        '204': { description: Sin asistencias }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /clases/{claseId}/cerrar:
    parameters:
      - { name: claseId, in: path, required: true, schema: { type: integer, example: 5 } }
    post:
      tags: [asistencias]
      summary: Cierra la clase; los pendientes pasan a ausentes (permiso asistencias.gestionar)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Clase cerrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  clase_id:          { type: integer, example: 5 }
                  estado:            { type: string, example: cerrada }
                  marcados_ausentes: { type: integer, example: 74 }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /roles:
    get:
      tags: [roles]
      summary: Lista los roles con sus permisos (permiso roles.gestionar)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Roles con permisos
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Rol' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /permisos:
    get:
      tags: [roles]
      summary: Catálogo de permisos (permiso roles.leer)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Catálogo de permisos
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Permiso' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /roles/{codigo}/permisos:
    parameters:
      - { name: codigo, in: path, required: true, schema: { type: string, example: admin } }
    put:
      tags: [roles]
      summary: Reemplaza los permisos de un rol (permiso roles.gestionar)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PermisosRolInput' }
      responses:
        '200':
          description: Permisos del rol actualizados
          content:
            application/json:
              schema:
                type: object
                properties:
                  codigo:   { type: string, example: admin }
                  permisos: { type: array, items: { type: string }, example: [docentes.leer, estudiantes.leer] }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /registros:
    get:
      tags: [registros]
      summary: Listado del registro de auditoría (permiso registros.leer)
      description: >
        Lista las acciones auditadas (altas, ediciones, bajas, permisos, equipos, envío de
        QRs, cierre de asistencia) ordenadas por fecha, más recientes primero. Filtros
        opcionales `email` (parcial, sobre el email del actor), `accion` (código exacto,
        ej. `grupos.renombrar`), `tipo` (`docente` = Admin, `estudiante` = Alumno) y
        `cursada`; `_orden` (`asc`/`desc`, default `desc`) ordena por horario. De los alumnos
        solo entran `grupos.crear` y `grupos.renombrar` (las demás acciones de estudiantes se
        auditan pero no se listan). Cada fila incluye `rol` (cargo del actor: Profesor |
        Ayudante | Colaborador | Alumno).
        La escritura de la tabla la hace la propia API tras cada mutación exitosa; es de
        solo lectura (no hay endpoints de alta/edición/borrado).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: email, in: query, required: false, schema: { type: string, example: jlopez }, description: 'Parcial, matchea el email del actor' }
        - { name: accion, in: query, required: false, schema: { type: string, example: grupos.renombrar } }
        - { name: tipo, in: query, required: false, schema: { type: string, enum: [docente, estudiante] } }
        - { name: cursada, in: query, required: false, schema: { type: integer, minimum: 1 } }
        - { name: _orden, in: query, required: false, schema: { type: string, enum: [asc, desc], default: desc } }
        - { name: _offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: _limit, in: query, required: false, schema: { type: integer, minimum: 1, default: 10 } }
      responses:
        '200':
          description: Registros (paginado)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistrosPaginado' }
        '204': { description: Sin registros para los filtros indicados }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:    { type: string, example: bruno@fi.uba.ar }
        password: { type: string, example: mi-password }

    LoginResponse:
      type: object
      properties:
        token: { type: string, example: 'eyJhbGciOi...' }
        usuario:
          type: object
          properties:
            id:    { type: integer, example: 1 }
            tipo:  { type: string, example: docente }
            email: { type: string, example: bruno@fi.uba.ar }
            rol:   { type: string, example: super_admin }

    Identidad:
      type: object
      properties:
        id:       { type: integer, example: 1 }
        tipo:     { type: string, enum: [docente, estudiante], example: docente }
        email:    { type: string, example: bruno@fi.uba.ar }
        rol:      { type: string, enum: [super_admin, admin, usuario], example: super_admin }
        permisos: { type: array, items: { type: string }, example: [docentes.leer, estudiantes.leer] }

    Docente:
      type: object
      properties:
        id:         { type: integer, example: 1 }
        nombre:     { type: string, example: Bruno }
        apellido:   { type: string, example: Lanzillotta }
        email:      { type: string, example: bruno@fi.uba.ar }
        rol:        { type: string, enum: [Profesor, Ayudante, Colaborador], example: Profesor }
        foto:       { type: string, nullable: true }
        activo:     { type: boolean, example: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    DocenteInput:
      type: object
      required: [nombre, apellido, email, rol]
      properties:
        nombre:   { type: string, maxLength: 100 }
        apellido: { type: string, maxLength: 100 }
        email:    { type: string }
        rol:      { type: string, enum: [Profesor, Ayudante, Colaborador] }
        foto:     { type: string, nullable: true }

    ImportCsvResponse:
      type: object
      properties:
        estudiantes_creados: { type: integer, example: 248, description: 'Estudiantes nuevos creados' }
        inscriptos:          { type: integer, example: 250, description: 'Inscripciones creadas en la cursada vigente' }
        omitidos:
          type: array
          description: Filas ya inscriptas en la cursada vigente o duplicadas en el archivo
          items:
            type: object
            properties:
              padron: { type: string, example: '111' }
              motivo: { type: string, example: 'ya inscripto en la cursada vigente' }
        errores:
          type: array
          items:
            type: object
            properties:
              fila:   { type: integer, example: 5 }
              motivo: { type: string, example: 'Email inválido: -' }

    Estudiante:
      type: object
      properties:
        id:         { type: integer, example: 1 }
        padron:     { type: string, example: '116530' }
        nombre:     { type: string, example: Ian }
        apellido:   { type: string, example: Acosta }
        email:      { type: string, example: ian@fi.uba.ar }
        activo:     { type: boolean, example: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PaginacionLinks:
      type: object
      description: Links HATEOAS de navegación (según la posición en la colección)
      properties:
        _first: { type: object, properties: { href: { type: string } } }
        _prev:  { type: object, properties: { href: { type: string } } }
        _next:  { type: object, properties: { href: { type: string } } }
        _last:  { type: object, properties: { href: { type: string } } }

    Curso:
      type: object
      properties:
        id:           { type: integer, example: 9 }
        codigo:       { type: string, example: TB022 }
        nombre:       { type: string, example: Introducción al Desarrollo de Software }
        anio:         { type: integer, example: 2026 }
        cuatrimestre: { type: integer, example: 2 }
        fecha_inicio: { type: string, format: date, example: '2026-08-01' }
        fecha_fin:    { type: string, format: date, example: '2026-12-15' }
        vigente:      { type: boolean, description: 'true si la cursada transcurre hoy (inicio ≤ hoy ≤ fin)', example: true }

    Materia:
      type: object
      properties:
        id:          { type: integer, example: 3 }
        codigo:      { type: string, example: TB022 }
        nombre:      { type: string, example: Introducción al Desarrollo de Software }
        descripcion: { type: string, nullable: true }

    CursadaInput:
      type: object
      required: [codigo, nombre, anio, cuatrimestre, fecha_inicio, fecha_fin]
      properties:
        codigo:       { type: string, example: TB022 }
        nombre:       { type: string, example: Introducción al Desarrollo de Software }
        anio:         { type: integer, example: 2026 }
        cuatrimestre: { type: integer, enum: [1, 2], example: 2 }
        fecha_inicio: { type: string, format: date, example: '2026-08-01' }
        fecha_fin:    { type: string, format: date, example: '2026-12-15' }

    CursadasPaginado:
      type: object
      properties:
        cursadas:
          type: array
          items: { $ref: '#/components/schemas/Curso' }
        _links: { $ref: '#/components/schemas/PaginacionLinks' }

    Registro:
      type: object
      description: >
        Fila de auditoría (foto inmutable: `actor_email` y `descripcion` quedan congelados
        aunque el actor se edite o se dé de baja después).
      properties:
        id:           { type: integer, example: 128 }
        actor_tipo:   { type: string, enum: [docente, estudiante], example: docente }
        actor_id:     { type: integer, example: 7 }
        actor_email:  { type: string, example: jlopez@fi.uba.ar }
        rol:
          type: string
          example: Profesor
          description: 'Cargo del actor al listar: Profesor | Ayudante | Colaborador | Alumno'
        accion:       { type: string, example: grupos.renombrar, description: 'Código estable de la acción' }
        descripcion:  { type: string, example: 'Renombró el equipo "Alfa" a "Beta"', description: 'Texto listo para mostrar' }
        cursada_id:   { type: integer, nullable: true, example: 9 }
        detalle:      { type: object, example: { grupo_id: 3, nombre_anterior: Alfa, nombre_nuevo: Beta }, description: 'Ids y metadatos antes/después' }
        created_at:   { type: string, format: date-time }

    RegistrosPaginado:
      type: object
      properties:
        registros:
          type: array
          items: { $ref: '#/components/schemas/Registro' }
        _links: { $ref: '#/components/schemas/PaginacionLinks' }

    Instancia:
      type: object
      description: >
        Fecha/convocatoria donde se rinde o entrega una evaluación. Las notas
        (individuales y de equipo) cuelgan de la instancia; la nota que vale para
        la evaluación es la de la última instancia rendida por el alumno/equipo.
      properties:
        id:                { type: integer, example: 21 }
        evaluacion_id:     { type: integer, example: 7 }
        evaluacion_nombre: { type: string, example: Parcial }
        numero:            { type: integer, example: 1, description: 'Orden dentro de la evaluación' }
        nombre:            { type: string, example: '1er parcial' }
        fecha:             { type: string, format: date, nullable: true, example: '2026-04-10' }
        estado:            { type: string, enum: [abierta, cerrada], example: abierta }
        created_at:        { type: string, format: date-time }
        updated_at:        { type: string, format: date-time, nullable: true }

    InstanciaCrear:
      type: object
      required: [nombre]
      properties:
        nombre: { type: string, maxLength: 80, example: '1er parcial' }
        fecha:  { type: string, format: date, nullable: true, example: '2026-04-10' }

    InstanciaActualizar:
      type: object
      description: Al menos uno de los campos. `fecha: null` la limpia.
      properties:
        nombre: { type: string, maxLength: 80, example: '1er parcial (reprogramado)' }
        fecha:  { type: string, format: date, nullable: true, example: '2026-04-17' }
        estado: { type: string, enum: [abierta, cerrada] }

    EstudiantesPaginado:
      type: object
      properties:
        estudiantes:
          type: array
          items: { $ref: '#/components/schemas/EstudianteEnCursada' }
        _links: { $ref: '#/components/schemas/PaginacionLinks' }

    EstudianteEnCursada:
      type: object
      properties:
        id:       { type: integer, example: 1 }
        padron:   { type: string, example: '116530' }
        nombre:   { type: string, example: Ian }
        apellido: { type: string, example: Acosta }
        email:    { type: string, example: ian@fi.uba.ar }
        recursa:  { type: boolean, example: false }
        estado:   { type: string, enum: [cursando, abandono, baja], example: cursando }
        motivos_baja:
          type: array
          description: Histórico de bajas del estudiante (todas las cursadas)
          items:
            type: object
            properties:
              anio:         { type: integer, example: 2025 }
              cuatrimestre: { type: integer, example: 1 }
              motivo:       { type: string, example: 'No cumplió la regularidad' }

    EstudianteInput:
      type: object
      required: [padron, nombre, apellido, email, password]
      properties:
        padron:   { type: string, maxLength: 20 }
        nombre:   { type: string, maxLength: 100 }
        apellido: { type: string, maxLength: 100 }
        email:    { type: string }
        password: { type: string, description: 'Obligatorio al crear; opcional al actualizar' }
        cursada_id:
          type: integer
          minimum: 1
          description: >
            Solo al crear: inscribe en esa cursada en lugar de la vigente (el front envía la
            cursada seleccionada en el panel). Sin él, se usa la cursada vigente según la fecha
            actual — ambiguo si hay varias materias con cursada vigente.

    Clase:
      type: object
      properties:
        id:         { type: integer, example: 5 }
        cursada_id: { type: integer, example: 9 }
        fecha:      { type: string, format: date, example: '2026-09-01' }
        titulo:     { type: string, nullable: true, example: 'Clase 1' }
        estado:     { type: string, enum: [abierta, cerrada], example: abierta }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time, nullable: true }

    ClaseResumida:
      type: object
      properties:
        id:     { type: integer, example: 5 }
        fecha:  { type: string, format: date, example: '2026-09-01' }
        titulo: { type: string, nullable: true, example: 'Clase 1' }

    ClasesPaginado:
      type: object
      properties:
        clases:
          type: array
          items: { $ref: '#/components/schemas/ClaseResumida' }
        _links: { $ref: '#/components/schemas/PaginacionLinks' }

    EnvioResumen:
      type: object
      properties:
        clase_id:         { type: integer, example: 5 }
        total:            { type: integer, example: 120 }
        enviados:         { type: integer, example: 45 }
        con_error:        { type: integer, example: 1 }
        quedan:           { type: integer, example: 74 }
        completo:         { type: boolean, example: false }
        enviados_en_lote: { type: integer, example: 15, description: 'Sólo en POST /enviar-qrs sin cola (envío sincrónico)' }
        reencolados:      { type: integer, example: 7, description: 'Sólo en POST /enviar-qrs: envíos fallidos reencolados (con reintentar=true)' }
        encolados:        { type: integer, example: 120, description: 'Sólo en POST /enviar-qrs con cola (QStash): asistencias encoladas al worker' }

    Asistencia:
      type: object
      properties:
        estudiante_id: { type: integer, example: 3 }
        padron:        { type: string, example: '116530' }
        nombre:        { type: string, example: Ana }
        apellido:      { type: string, example: Perez }
        email:         { type: string, example: ana@fi.uba.ar }
        codigo:        { type: string, example: 'ABCD2345' }
        estado:        { type: string, enum: [pendiente, presente, ausente] }
        metodo:        { type: string, nullable: true, enum: [qr, manual, padron] }
        marcado_at:    { type: string, format: date-time, nullable: true }
        enviado:       { type: boolean, example: true }

    AsistenciaBusqueda:
      type: object
      properties:
        clase_id:      { type: integer, example: 5 }
        fecha:         { type: string, format: date, example: '2026-09-01' }
        titulo:        { type: string, nullable: true, example: 'Clase 1' }
        estudiante_id: { type: integer, example: 3 }
        padron:        { type: string, example: '116530' }
        nombre:        { type: string, example: Ana }
        apellido:      { type: string, example: Perez }
        email:         { type: string, example: ana@fi.uba.ar }
        estado:        { type: string, enum: [pendiente, presente, ausente] }
        metodo:        { type: string, nullable: true, enum: [qr, manual, padron] }
        marcado_at:    { type: string, format: date-time, nullable: true }

    AsistenciasBusquedaPaginado:
      type: object
      properties:
        asistencias:
          type: array
          items: { $ref: '#/components/schemas/AsistenciaBusqueda' }
        _links: { $ref: '#/components/schemas/PaginacionLinks' }

    MarcaAsistencia:
      type: object
      properties:
        clase_id:      { type: integer, example: 5 }
        estudiante_id: { type: integer, example: 3 }
        padron:        { type: string, example: '116530' }
        nombre:        { type: string, example: Ana }
        apellido:      { type: string, example: Perez }
        estado:        { type: string, example: presente }
        metodo:        { type: string, enum: [qr, manual, padron], example: qr }

    Rol:
      type: object
      properties:
        codigo:      { type: string, example: admin }
        nombre:      { type: string, example: Admin }
        descripcion: { type: string, nullable: true }
        permisos:    { type: array, items: { type: string }, example: [docentes.leer, estudiantes.leer] }

    Permiso:
      type: object
      properties:
        codigo:      { type: string, example: docentes.gestionar }
        descripcion: { type: string, nullable: true }

    PermisosRolInput:
      type: object
      required: [permisos]
      properties:
        permisos:
          type: array
          items: { type: string }
          example: [docentes.leer, estudiantes.leer, estudiantes.gestionar]

    OverridesInput:
      type: object
      required: [permisos]
      properties:
        permisos:
          type: array
          items:
            type: object
            properties:
              permiso:   { type: string, example: docentes.gestionar }
              concedido: { type: boolean, example: true }

    OverridesResponse:
      type: object
      properties:
        docente_id:    { type: integer, nullable: true }
        estudiante_id: { type: integer, nullable: true }
        permisos:
          type: array
          items:
            type: object
            properties:
              codigo:    { type: string }
              concedido: { type: boolean }

    Error:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              code:        { type: string, example: auth.forbidden }
              message:     { type: string, example: 'Permiso insuficiente' }
              level:       { type: string, example: error }
              description: { type: string }
